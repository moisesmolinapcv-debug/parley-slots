name: Parley Daily Pipeline

on:
  schedule:
    # 06:00 UTC = 02:00 AM Venezuela (VET = UTC-4)
    - cron: '0 6 * * *'
  workflow_dispatch:  # Permite ejecución manual desde GitHub Actions

jobs:
  daily-update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # 1. Checkout del repositorio
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # 2. Configurar Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # 3. Instalar dependencias
      - name: Install dependencies
        run: pip install requests

      # 4. Ejecutar el pipeline
      - name: Run Parley Pipeline
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TELEGRAM_BOT_TOKEN:   ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:     ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python pipeline/parley_pipeline.py

      # 5. Verificar si slots.json cambió
      - name: Check for changes
        id: check_changes
        run: |
          git diff --quiet data/slots.json || echo "changed=true" >> $GITHUB_OUTPUT

      # 6. Commit y push si hay cambios
      - name: Commit updated slots.json
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config user.name  "Parley Pipeline Bot"
          git config user.email "pipeline@parley.com.ve"
          git add data/slots.json
          git commit -m "auto: Daily slot update $(date +'%Y-%m-%d')"
          git push

      # 7. En caso de error: notificar
      - name: Notify on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="ERROR CRITICO en PARLEY PIPELINE — Revisar GitHub Actions" \
            -d parse_mode="HTML"
